name: CI

on:
  push:
    branches: [ main ]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0 # diff-cover needs history to resolve the merge base with main

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Run checks and coverage report
        run: ./gradlew check jacocoTestReport

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: |
            **/build/reports/tests/
            **/build/test-results/
          retention-days: 14

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: jacoco-report
          path: '**/build/reports/jacoco/test/jacocoTestReport.xml'
          retention-days: 14

      # The baseline is the jar of our own last tag, named in gradle/abi-baseline.tag. No such
      # file means no tag has been cut yet, and then the gate is not given -PbaselineJarDir and
      # ends as an explicit SKIPPED. See docs/ENGINE.md §7.1 for how to cut that first tag.
      - name: Download the ABI baseline
        if: hashFiles('gradle/abi-baseline.tag') != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p .abi-baseline
          gh release download "$(tr -d '[:space:]' < gradle/abi-baseline.tag)" \
            --repo "$GITHUB_REPOSITORY" --dir .abi-baseline --clobber \
            --pattern plugin-api.jar --pattern protocol.jar

      # Only the stable surface takes this gate, the engine does not: whoever takes it is a
      # stable surface (docs/DESIGN-M2.md §24). Once the tag file exists the parameter is passed
      # unconditionally, so a baseline that failed to download fails the gate instead of skipping it.
      - name: ABI gate of the stable surface
        run: |
          if [ -f gradle/abi-baseline.tag ]; then
            ./gradlew :plugin-api:checkBinaryCompatibility :protocol:checkBinaryCompatibility -PbaselineJarDir=.abi-baseline
          else
            ./gradlew :plugin-api:checkBinaryCompatibility :protocol:checkBinaryCompatibility
          fi

      - name: Set up Python
        if: github.event_name == 'pull_request'
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Install diff-cover
        if: github.event_name == 'pull_request'
        run: pip install diff-cover

      - name: Gate coverage of newly added lines
        if: github.event_name == 'pull_request'
        run: |
          git fetch --no-tags origin main:refs/remotes/origin/main
          diff-cover $(find . -path '*/build/reports/jacoco/test/jacocoTestReport.xml' | sort) \
            --compare-branch=origin/main \
            --src-roots src/main/java testing/src/main/java protocol/src/main/java plugin-api/src/main/java server-app/src/main/java game-rts/src/main/java \
            --fail-under=80
