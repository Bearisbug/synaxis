name: CI

on:
  push:
    branches: [ main ]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0 # diff-cover needs history to resolve the merge base with main

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Run checks and coverage report
        run: ./gradlew check jacocoTestReport

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: |
            **/build/reports/tests/
            **/build/test-results/
          retention-days: 14

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: jacoco-report
          path: build/reports/jacoco/test/jacocoTestReport.xml
          retention-days: 14

      - name: Set up Python
        if: github.event_name == 'pull_request'
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Install diff-cover
        if: github.event_name == 'pull_request'
        run: pip install diff-cover

      - name: Gate coverage of newly added lines
        if: github.event_name == 'pull_request'
        run: |
          git fetch --no-tags origin main:refs/remotes/origin/main
          diff-cover build/reports/jacoco/test/jacocoTestReport.xml \
            --compare-branch=origin/main \
            --src-roots src/main/java src/autogenerated/java \
            --fail-under=80
