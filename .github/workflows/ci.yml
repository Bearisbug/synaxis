name: CI

on:
  push:
    branches: [ main ]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    # The player store tests (docs/DESIGN-PROD.md REQ-PROD-005) run against a real PostgreSQL and
    # Valkey. With SYNAXIS_TEST_PG_URL set, an unreachable database fails them instead of skipping.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: synaxis
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
      valkey:
        image: valkey/valkey:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      SYNAXIS_TEST_PG_URL: jdbc:postgresql://127.0.0.1:5432/postgres
      SYNAXIS_TEST_PG_USER: postgres
      SYNAXIS_TEST_PG_PASSWORD: synaxis
      SYNAXIS_TEST_REDIS_URL: redis://127.0.0.1:6379
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0 # diff-cover needs history to resolve the merge base with main

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Run checks and coverage report
        run: ./gradlew check jacocoTestReport -Dsynaxis.synx.require-frozen-zlib=true

      # Without this a job that lost its database would pass with the store tests skipped
      - name: Check that the player store tests ran against the database
        run: |
          for suite in PlayerStoreIntegrationTest ShardSessionDbTest MigrationsDbTest CrossShardHandoverIntegrationTest \
              ShutdownSaveIntegrationTest TransferTicketsIntegrationTest StoreHousekeepingDbTest; do
            grep -q 'skipped="0"' "server-app/build/test-results/test/TEST-io.github.bearisbug.synaxis.app.store.$suite.xml"
          done

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: |
            **/build/reports/tests/
            **/build/test-results/
          retention-days: 14

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: jacoco-report
          path: '**/build/reports/jacoco/test/jacocoTestReport.xml'
          retention-days: 14

      # The baseline is the jar of our own last tag, named in gradle/abi-baseline.tag. No such
      # file means no tag has been cut yet, and then the gate is not given -PbaselineJarDir and
      # ends as an explicit SKIPPED. See docs/ENGINE.md §7.1 for how to cut that first tag.
      - name: Download the ABI baseline
        if: hashFiles('gradle/abi-baseline.tag') != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p .abi-baseline
          gh release download "$(tr -d '[:space:]' < gradle/abi-baseline.tag)" \
            --repo "$GITHUB_REPOSITORY" --dir .abi-baseline --clobber \
            --pattern plugin-api.jar --pattern protocol.jar

      # Only the stable surface takes this gate, the engine does not: whoever takes it is a
      # stable surface (docs/DESIGN-M2.md §24). Once the tag file exists the parameter is passed
      # unconditionally, so a baseline that failed to download fails the gate instead of skipping it.
      - name: ABI gate of the stable surface
        run: |
          if [ -f gradle/abi-baseline.tag ]; then
            ./gradlew :plugin-api:checkBinaryCompatibility :protocol:checkBinaryCompatibility -PbaselineJarDir=.abi-baseline
          else
            ./gradlew :plugin-api:checkBinaryCompatibility :protocol:checkBinaryCompatibility
          fi

      - name: Set up Python
        if: github.event_name == 'pull_request'
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Install diff-cover
        if: github.event_name == 'pull_request'
        run: pip install diff-cover

      - name: Gate coverage of newly added lines
        if: github.event_name == 'pull_request'
        run: |
          git fetch --no-tags origin main:refs/remotes/origin/main
          diff-cover $(find . -path '*/build/reports/jacoco/test/jacocoTestReport.xml' | sort) \
            --compare-branch=origin/main \
            --src-roots src/main/java testing/src/main/java protocol/src/main/java plugin-api/src/main/java server-app/src/main/java game-rts/src/main/java synx/src/main/java \
            --fail-under=80

  # REQ-PROD-019: the whole suite again with four tick threads and the ownership assertions on.
  # The counter provider spreads the chunks of one instance over all four threads.
  multithreaded:
    name: Test with 4 tick threads (strict)
    runs-on: ubuntu-latest
    # The same database and Valkey as the check job, the store tests are part of the suite
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: synaxis
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
      valkey:
        image: valkey/valkey:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      SYNAXIS_TEST_PG_URL: jdbc:postgresql://127.0.0.1:5432/postgres
      SYNAXIS_TEST_PG_USER: postgres
      SYNAXIS_TEST_PG_PASSWORD: synaxis
      SYNAXIS_TEST_REDIS_URL: redis://127.0.0.1:6379
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Run the tests with 4 tick threads
        run: ./gradlew test -Dsynaxis.dispatcher-threads=4 -Dsynaxis.acquirable-strict=true

      # Without this a build that stopped forwarding the properties would pass on one thread
      - name: Check that the tests ran with 4 tick threads
        run: |
          grep -q 'env dispatcher threads: 4' testing/build/test-results/test/TEST-io.github.bearisbug.synaxis.testing.test.EnvDispatcherThreadsIntegrationTest.xml

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports-multithreaded
          path: |
            **/build/reports/tests/
            **/build/test-results/
          retention-days: 14

  # REQ-PROD-020: the same round with the chunks spread by the grid of 16 by 16 chunk cells, the
  # provider of the MMO shards; side by side with the counter round above.
  multithreaded-grid:
    name: Test with 4 tick threads (strict, grid)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: synaxis
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
      valkey:
        image: valkey/valkey:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      SYNAXIS_TEST_PG_URL: jdbc:postgresql://127.0.0.1:5432/postgres
      SYNAXIS_TEST_PG_USER: postgres
      SYNAXIS_TEST_PG_PASSWORD: synaxis
      SYNAXIS_TEST_REDIS_URL: redis://127.0.0.1:6379
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Run the tests with 4 tick threads on the grid
        run: ./gradlew test -Dsynaxis.dispatcher-threads=4 -Dsynaxis.acquirable-strict=true -Dsynaxis.thread-provider=grid

      # Without this a build that stopped forwarding the properties would pass on the counter
      - name: Check that the tests ran with 4 tick threads on the grid
        run: |
          report=testing/build/test-results/test/TEST-io.github.bearisbug.synaxis.testing.test.EnvDispatcherThreadsIntegrationTest.xml
          grep -q 'env dispatcher threads: 4' "$report"
          grep -q 'env thread provider: grid' "$report"

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports-multithreaded-grid
          path: |
            **/build/reports/tests/
            **/build/test-results/
          retention-days: 14
