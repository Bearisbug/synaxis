metadata.format.version = "1.1"

[versions]

# Important dependencies
minecraft = "26.2"
adventure = "5.2.0"
jetbrainsAnnotations = "26.1.0"
slf4j = "2.0.20"

# Performance / Data Structures
fastutil = "8.5.19"
flare = "2.0.1"
gson = "2.14.0"
jcTools = "4.0.7"

# Quality
junit = "6.1.3"
archunit = "1.5.1"
jmh = "1.37"
jcstress = "0.16"
errorprone = "2.50.0"

# Log impl (for demo)
logback = "1.6.5"

# Player data store of the host (docs/DESIGN-PROD.md API-PROD-004, API-PROD-006)
postgresql = "42.7.14"
hikaricp = "7.1.0"
flyway = "13.10.3"
jedis = "8.0.2"

# Metrics endpoint of the host (docs/DESIGN-PROD.md API-PROD-015)
micrometer = "1.17.1"

# Management interface of the host (docs/DESIGN-PROD.md API-PROD-022, ADR-PROD-014)
javaWebsocket = "1.6.0"

# Gradle plugins
blossom = "2.2.0"
nmcp = "1.6.2"
graaltools = "1.1.14"
jmh-plugin = "0.7.3"
jcstress-plugin = "0.9.0"
errorprone-plugin = "5.1.1"

[libraries]

# Important Dependencies
# Adventure
adventure-api = { group = "net.kyori", name = "adventure-api", version.ref = "adventure" }
adventure-nbt = { group = "net.kyori", name = "adventure-nbt", version.ref = "adventure" }
adventure-serializer-gson = { group = "net.kyori", name = "adventure-text-serializer-gson", version.ref = "adventure" }
adventure-serializer-legacy = { group = "net.kyori", name = "adventure-text-serializer-legacy", version.ref = "adventure" }
adventure-serializer-plain = { group = "net.kyori", name = "adventure-text-serializer-plain", version.ref = "adventure" }
adventure-serializer-ansi = { group = "net.kyori", name = "adventure-text-serializer-ansi", version.ref = "adventure" }
adventure-text-logger-slf4j = { group = "net.kyori", name = "adventure-text-logger-slf4j", version.ref = "adventure" }

# Miscellaneous
jetbrainsAnnotations = { group = "org.jetbrains", name = "annotations", version.ref = "jetbrainsAnnotations" }
slf4j = { group = "org.slf4j", name = "slf4j-api", version.ref = "slf4j" }

# Performance / Data Structures
fastutil = { group = "it.unimi.dsi", name = "fastutil", version.ref = "fastutil" }
flare = { group = "space.vectrix.flare", name = "flare", version.ref = "flare" }
flare-fastutil = { group = "space.vectrix.flare", name = "flare-fastutil", version.ref = "flare" }
gson = { group = "com.google.code.gson", name = "gson", version.ref = "gson" }
jcTools = { group = "org.jctools", name = "jctools-core-jdk11", version.ref = "jcTools" }

# Code quality
junit-api = { group = "org.junit.jupiter", name = "junit-jupiter-api", version.ref = "junit" }
junit-engine = { group = "org.junit.jupiter", name = "junit-jupiter-engine", version.ref = "junit" }
junit-params = { group = "org.junit.jupiter", name = "junit-jupiter-params", version.ref = "junit" }
junit-suite-api = { group = "org.junit.platform", name = "junit-platform-suite-api", version.ref = "junit" }
junit-suite-engine = { group = "org.junit.platform", name = "junit-platform-suite-engine", version.ref = "junit" }
jmh-core = { group = "org.openjdk.jmh", name = "jmh-core", version.ref = "jmh" }
jmh-annotationprocessor = { group = "org.openjdk.jmh", name = "jmh-generator-annprocess", version.ref = "jmh" }
jcstress-core = { group = "org.openjdk.jcstress", name = "jcstress-core", version.ref = "jcstress" }
errorprone-core = { group = "com.google.errorprone", name = "error_prone_core", version.ref = "errorprone" }
archunit-junit5 = { group = "com.tngtech.archunit", name = "archunit-junit5", version.ref = "archunit" }

# Log impl (for demo)
logback-core = { group = "ch.qos.logback", name = "logback-core", version.ref = "logback" }
logback-classic = { group = "ch.qos.logback", name = "logback-classic", version.ref = "logback" }

# Player data store of the host
postgresql = { group = "org.postgresql", name = "postgresql", version.ref = "postgresql" }
hikaricp = { group = "com.zaxxer", name = "HikariCP", version.ref = "hikaricp" }
flyway-core = { group = "org.flywaydb", name = "flyway-core", version.ref = "flyway" }
flyway-postgresql = { group = "org.flywaydb", name = "flyway-database-postgresql", version.ref = "flyway" }
jedis = { group = "redis.clients", name = "jedis", version.ref = "jedis" }

# Metrics endpoint of the host
micrometer-registry-prometheus = { group = "io.micrometer", name = "micrometer-registry-prometheus", version.ref = "micrometer" }

# Management interface of the host
java-websocket = { group = "org.java-websocket", name = "Java-WebSocket", version.ref = "javaWebsocket" }

[bundles]

flare = ["flare", "flare-fastutil"]
adventure = ["adventure-api", "adventure-nbt", "adventure-serializer-gson", "adventure-serializer-legacy", "adventure-serializer-plain", "adventure-serializer-ansi", "adventure-text-logger-slf4j"]
junit = ["junit-api", "junit-engine", "junit-params", "junit-suite-api", "junit-suite-engine"]
logback = ["logback-core", "logback-classic"]

[plugins]
blossom = { id = "net.kyori.blossom", version.ref = "blossom" }
jmh-plugin = { id = "me.champeau.jmh", version.ref = "jmh-plugin" }
jcstress-plugin = { id = "io.github.reyerizo.gradle.jcstress", version.ref = "jcstress-plugin" }
errorprone-plugin = { id = "net.ltgt.errorprone", version.ref = "errorprone-plugin" }
nmcp = { id = "com.gradleup.nmcp", version.ref = "nmcp" }
nmcp-aggregation = { id = "com.gradleup.nmcp.aggregation", version.ref = "nmcp" }
graalvm-native = { id = "org.graalvm.buildtools.native", version.ref = "graaltools" }
