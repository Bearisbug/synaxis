# Frozen layering rule, see ArchitectureTest and docs/DESIGN.md §24.
# The store is committed, so it is created once and never rewritten by a build:
# a build that would need to record a new violation fails instead.
freeze.store.default.path=src/test/resources/archunit_store
freeze.store.default.allowStoreCreation=true
freeze.store.default.allowStoreUpdate=false
