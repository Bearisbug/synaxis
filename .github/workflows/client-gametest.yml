name: Client gametest

# REQ-PROD-030 / API-PROD-026: a pull request touching the client, the wire or the server runs the
# production mod jar once; main and the daily run take both launches, and the daily one the spikes too.
on:
  pull_request:
    paths:
      - client-fabric/**
      - protocol/**
      - server-app/**
      - game-rts/**
      - plugin-api/**
      - src/main/java/**/network/**
      - src/main/java/**/listener/**
      - .github/workflows/client-gametest.yml
  push:
    branches: [ main ]
  schedule:
    - cron: '0 18 * * *'
    # P10 only, weekly (Sunday): each run holds a runner about 45 to 60 minutes
    - cron: '0 19 * * 0'
  workflow_dispatch:
    inputs:
      p10:
        description: Run only the P10 job (two shards, 100 round trips) instead of the regression
        type: boolean
        default: false
      handshake_phase:
        description: synaxis.app.handshake-phase of the server-app the client joins
        type: choice
        options: [ configuration, login ]
        default: configuration

permissions:
  contents: read

jobs:
  # The real Minecraft client, driven by fabric-client-gametest-api, against a server-app in game
  # mode: the regression assertions R1 to R8 (RegressionClientGameTest), the playable script's steps
  # G1 to G10 on a second server-app serving the flat core world and its RTS steps on the first
  # (PlayableClientGameTest, docs/DESIGN-PROD.md §19), plus on the daily run the spikes of
  # docs/research/client-spikes-2026-09/README.md. Xvfb gives it a display and Mesa llvmpipe gives it
  # OpenGL, the same as client-fabric/gametest-env/ does in Docker.
  # The login is the full online path with no Mojang account: the client joins at
  # tools/fake-sessionserver in record mode, the server in online mode asks the same one hasJoined,
  # and the connection is encrypted.
  gametest:
    name: Run the client gametests
    # Not on the weekly P10 schedule, and not when a manual run asks for P10 only
    if: github.event.schedule != '0 19 * * 0' && !(github.event_name == 'workflow_dispatch' && inputs.p10)
    # Pinned: ubuntu-latest moves to Ubuntu 26 from 2026-10-19, and the Xvfb and Mesa packages below are the 24.04 ones
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      HANDSHAKE_PHASE: ${{ inputs.handshake_phase || 'configuration' }}
      # A pull request launches the client once (the production jar); every other trigger twice.
      LAUNCHES: ${{ github.event_name == 'pull_request' && '1' || '2' }}
      # The spikes' S1 connects once more per launch. S3's distances are the ones the spike report used.
      SYNAXIS_SPIKES: ${{ github.event_name == 'schedule' && 'all' || '' }}
      SYNAXIS_S3_DISTANCES: ${{ github.event_name == 'schedule' && '97,130,150,170,200,250,300,340' || '' }}
      # Connections per launch to the game mode server: R1 to R8 one, the playable script's rts G1 and
      # rts G10 two more, S1 of the spikes one more again
      CONNECTIONS_PER_LAUNCH: ${{ github.event_name == 'schedule' && '4' || '3' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      # Two servers and the client share this runner; what it had is part of reading a slow run
      - name: Show the runner's processors and memory
        run: |
          nproc
          free -m

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: true

      - name: Install Xvfb and Mesa
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            xvfb xauth libgl1 libgl1-mesa-dri libegl1 libglx-mesa0 mesa-utils

      # `env -u CI`: the publishing convention requires signing whenever CI is set (see client-mod.yml).
      - name: Publish :protocol to the local repository
        run: env -u CI ./gradlew :protocol:publishToMavenLocal

      # Its first line names the port it took; the client's authlib and the server both go there.
      - name: Start the fake sessionserver in record mode
        run: |
          # The background fork opens the log on its own schedule; without the file the sed below exits 2 under bash -e
          : > sessionserver.log
          (java tools/fake-sessionserver/FakeSessionServer.java --mode record --port 0 > sessionserver.log 2>&1 &)
          for _ in $(seq 1 60); do
            port=$(sed -n 's|.*listening on http://127.0.0.1:\([0-9]*\),.*|\1|p' sessionserver.log)
            if [ -n "$port" ]; then
              echo "SESSION_HOST=http://127.0.0.1:$port" >> "$GITHUB_ENV"
              exit 0
            fi
            sleep 1
          done
          cat sessionserver.log
          exit 1

      # The flat core server below runs from the start script. Built before the game mode server
      # starts, so that no second Gradle build runs beside the one that `:server-app:run` keeps busy.
      - name: Build the server's start script
        run: ./gradlew :server-app:installDist

      # server-app reads commands from stdin; `tail -f /dev/null` keeps it open for the whole job.
      - name: Start server-app in game mode
        run: |
          (tail -f /dev/null | ./gradlew :server-app:run --console=plain -Dsynaxis.app.auth=online \
            -Dsynaxis.app.auth.session-server="$SESSION_HOST/session/minecraft/hasJoined" \
            -Dsynaxis.app.port=25565 -Dsynaxis.app.handshake-phase=$HANDSHAKE_PHASE \
            > server.log 2>&1 &)
          for i in $(seq 1 300); do
            grep -q "server-app listening" server.log && exit 0
            sleep 1
          done
          cat server.log
          exit 1

      # The playable script's flat core world (API-PROD-026), in a working directory of its own: its
      # ledger in logs/ stays apart from the one the judge reads for the game mode server. Its metrics
      # endpoint takes any free port, the game mode server holds the default 127.0.0.1:9464; the store
      # is the default in-memory one, kept for both launches like the world.
      - name: Start server-app in core mode
        run: |
          mkdir -p "$RUNNER_TEMP/playable" && cd "$RUNNER_TEMP/playable"
          JAVA_OPTS="-Xms1G -Xmx1G -XX:-AlwaysPreTouch" \
          SERVER_APP_OPTS="-Dsynaxis.app.core-mode=on -Dsynaxis.app.port=25566 -Dsynaxis.app.shard-id=core \
            -Dsynaxis.app.metrics.bind=127.0.0.1:0 -Dsynaxis.app.auth=online \
            -Dsynaxis.app.auth.session-server=$SESSION_HOST/session/minecraft/hasJoined" \
            nohup "$GITHUB_WORKSPACE/server-app/build/install/server-app/bin/server-app" < /dev/null > server.log 2>&1 &
          echo $! > server.pid
          for _ in $(seq 1 180); do
            grep -q 'server-app listening' server.log && exit 0
            kill -0 "$(cat server.pid)" 2>/dev/null || break
            sleep 1
          done
          cat server.log
          exit 1

      # The exit codes of the two client steps are recorded, not judged: the judge step below reads
      # the reports and the server's ledger and log instead.
      - name: Run the client gametests
        if: env.LAUNCHES == '2'
        continue-on-error: true
        working-directory: client-fabric
        env:
          SYNAXIS_GAMETEST_SERVER: 127.0.0.1:25565
          SYNAXIS_PLAYABLE_SERVER: 127.0.0.1:25566
          SYNAXIS_GAMETEST_SESSION_HOST: ${{ env.SESSION_HOST }}
          LIBGL_ALWAYS_SOFTWARE: "1"
          GALLIUM_DRIVER: llvmpipe
        run: xvfb-run -a -s "-screen 0 1280x720x24" ./gradlew runClientGameTest --console=plain --stacktrace

      # The same tests against the remapped mod jar, :protocol nested in it (R1).
      - name: Run the client gametests against the production mod jar
        if: success() || failure()
        continue-on-error: true
        working-directory: client-fabric
        env:
          SYNAXIS_GAMETEST_SERVER: 127.0.0.1:25565
          SYNAXIS_PLAYABLE_SERVER: 127.0.0.1:25566
          SYNAXIS_GAMETEST_SESSION_HOST: ${{ env.SESSION_HOST }}
          LIBGL_ALWAYS_SOFTWARE: "1"
          GALLIUM_DRIVER: llvmpipe
        run: xvfb-run -a -s "-screen 0 1280x720x24" ./gradlew runProductionClientGameTest --console=plain --stacktrace

      - name: Show the reports and the server's event ledger
        if: always()
        run: |
          for report in client-fabric/build/run/*/synaxis-gametest/{report,playable}.txt; do echo "== $report"; cat "$report"; done || true
          cat logs/events-*.jsonl || true
          cat sessionserver.log || true

      - name: Judge the regression by the reports, the ledger and the server log
        if: success() || failure()
        env:
          SERVER_LOG: server.log
          LEDGER_DIR: logs
          SESSION_LOG: sessionserver.log
        run: |
          reports=(client-fabric/build/run/productionClientGameTest/synaxis-gametest/report.txt)
          if [ "$LAUNCHES" = 2 ]; then reports+=(client-fabric/build/run/clientGameTest/synaxis-gametest/report.txt); fi
          CONNECTIONS=$((LAUNCHES * CONNECTIONS_PER_LAUNCH)) CORE_CONNECTIONS=$((LAUNCHES * 2)) \
            client-fabric/gametest-env/judge.sh "${reports[@]}"

      - name: Upload screenshots, report and logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: client-gametest-${{ env.HANDSHAKE_PHASE }}
          path: |
            client-fabric/build/run/**/screenshots/
            client-fabric/build/run/**/synaxis-gametest/report.txt
            client-fabric/build/run/**/synaxis-gametest/playable.txt
            client-fabric/build/run/**/logs/
            server.log
            sessionserver.log
            logs/events-*.jsonl
            ${{ runner.temp }}/playable/server.log
            ${{ runner.temp }}/playable/logs/
          retention-days: 14

  # P10 of docs/DESIGN-PROD.md §19 (REQ-PROD-031, API-PROD-026): the real client sent from one map
  # shard to the other and back 100 times through the management interface's synaxis:transfer, both
  # shards in the directory mode. client-fabric/gametest-env/p10.py drives the transfers and judges
  # by its own record, the two ledgers and the client's report; docs/TEST.md TC-PROD-550 runs the same
  # locally. Not on pull requests: the 200 transfers alone hold the runner for about 1,100 s.
  p10:
    name: Two shards, 100 round trips (P10)
    # Weekly on Sunday and by hand (workflow_dispatch with p10: true): not on pull requests or pushes
    if: github.event.schedule == '0 19 * * 0' || (github.event_name == 'workflow_dispatch' && inputs.p10)
    # Pinned for the same reason as the regression's
    runs-on: ubuntu-24.04
    # The transfers take about 1,100 s (199 gaps of 5.5 s, more where an arrival is slower), the builds,
    # the client's start and the judge about 15 minutes more: 40 like the regression's would cut a
    # run that is only slow short
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: synaxis
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
      valkey:
        image: valkey/valkey:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      P10: ${{ github.workspace }}/p10
      SYNAXIS_STATE_DB_URL: jdbc:postgresql://127.0.0.1:5432/postgres
      SYNAXIS_STATE_DB_USER: postgres
      SYNAXIS_STATE_DB_PASSWORD: synaxis
      SYNAXIS_REDIS_URL: redis://127.0.0.1:6379
      PGPASSWORD: synaxis
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: true

      - name: Install Xvfb, Mesa and psql
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            xvfb xauth libgl1 libgl1-mesa-dri libegl1 libglx-mesa0 mesa-utils postgresql-client

      - name: Publish :protocol to the local repository
        run: env -u CI ./gradlew :protocol:publishToMavenLocal

      # The daemon goes afterwards: the two shards and the client need its memory on this 2 core, 7 GB runner
      - name: Build the server and the baker
        run: |
          ./gradlew :server-app:installDist :baker:installDist
          ./gradlew --stop

      # Standard library only, so nothing to install (docs/TEST.md TC-PROD-660)
      - name: Unit tests of p10.py
        run: python3 -m unittest discover -s client-fabric/gametest-env -p 'test_*.py'

      - name: Bake the map and write the shard directory
        run: |
          mkdir -p "$P10" && cd "$P10"
          "$GITHUB_WORKSPACE/baker/build/install/baker/bin/baker" bake --map-id p10 \
            --source generator:synthetic:1 --out maps --bounds 0,0,15,15 --threads 1
          echo "P10_BUILD=$(ls maps/p10)" >> "$GITHUB_ENV"
          python3 "$GITHUB_WORKSPACE/client-fabric/gametest-env/p10.py" shards --host 127.0.0.1 \
            --ports 25611,25612 --out maps/p10/shards.json

      # Made for this job and never printed: masked, and handed to the steps that need them in files
      # only the runner's user reads, not through GITHUB_ENV
      - name: Generate the ticket key and the management token
        run: |
          umask 077
          mkdir -p "$RUNNER_TEMP/p10-secrets"
          key=$(openssl rand -base64 32)
          token=$(openssl rand -hex 32)
          echo "::add-mask::$key"
          echo "::add-mask::$token"
          printf '1:%s' "$key" > "$RUNNER_TEMP/p10-secrets/hmac-keys"
          printf '%s' "$token" > "$RUNNER_TEMP/p10-secrets/management-token"

      - name: Start the fake sessionserver in record mode
        run: |
          # The background fork opens the log on its own schedule; without the file the sed below exits 2 under bash -e
          : > sessionserver.log
          (java -Xmx256m tools/fake-sessionserver/FakeSessionServer.java --mode record --port 0 > sessionserver.log 2>&1 &)
          for _ in $(seq 1 60); do
            port=$(sed -n 's|.*listening on http://127.0.0.1:\([0-9]*\),.*|\1|p' sessionserver.log)
            if [ -n "$port" ]; then
              echo "SESSION_HOST=http://127.0.0.1:$port" >> "$GITHUB_ENV"
              exit 0
            fi
            sleep 1
          done
          cat sessionserver.log
          exit 1

      # Online mode against the fake sessionserver is offline in effect (REQ-PROD-036), and a shard
      # refuses a database recorded for another mode
      - name: Migrate the shared database
        env:
          JAVA_OPTS: -Xms256m -Xmx256m -XX:-AlwaysPreTouch
        run: server-app/build/install/server-app/bin/server-app --migrate-only --auth-mode=offline

      # Each in a working directory of its own (logs/ and overlay/ are relative to it, docs/DESIGN-M3.md
      # API-M3-007), on the port the directory gives its channel; JAVA_OPTS comes after the 4G default
      - name: Start the two shards
        run: |
          start() { # <shard_id> <game port> <management port>
            mkdir -p "$P10/work-$1" && cd "$P10/work-$1"
            SYNAXIS_TRANSFER_HMAC_KEYS=$(cat "$RUNNER_TEMP/p10-secrets/hmac-keys") \
            SYNAXIS_MANAGEMENT_TOKEN=$(cat "$RUNNER_TEMP/p10-secrets/management-token") \
            JAVA_OPTS="-Xms1G -Xmx1G -XX:-AlwaysPreTouch" \
            SERVER_APP_OPTS="-Dsynaxis.app.port=$2 -Dsynaxis.app.auth=online \
              -Dsynaxis.app.auth.session-server=$SESSION_HOST/session/minecraft/hasJoined \
              -Dsynaxis.app.metrics.bind=127.0.0.1:0 -Dsynaxis.app.log=stdout \
              -Dsynaxis.map.root=$P10/maps/p10 -Dsynaxis.map.build=$P10_BUILD \
              -Dsynaxis.app.store=postgres -Dsynaxis.app.shard-id=$1 \
              -Dsynaxis.app.management.enabled=true -Dsynaxis.app.management.bind=127.0.0.1:$3" \
              nohup "$GITHUB_WORKSPACE/server-app/build/install/server-app/bin/server-shard" < /dev/null > shard.log 2>&1 &
            echo $! > shard.pid
          }
          start r0-c1 25611 25585
          start r0-c2 25612 25586
          for shard in r0-c1 r0-c2; do
            for _ in $(seq 1 180); do
              grep -q 'server-app listening on' "$P10/work-$shard/shard.log" && continue 2
              kill -0 "$(cat "$P10/work-$shard/shard.pid")" 2>/dev/null || break
              sleep 1
            done
            cat "$P10/work-$shard/shard.log"
            exit 1
          done

      # The production mod jar, in the background: the driver below decides when the run is over and
      # says so by creating $P10/done
      - name: Start the client
        working-directory: client-fabric
        env:
          SYNAXIS_P10_SERVER: 127.0.0.1:25611
          SYNAXIS_P10_DONE: ${{ github.workspace }}/p10/done
          SYNAXIS_GAMETEST_SESSION_HOST: ${{ env.SESSION_HOST }}
          LIBGL_ALWAYS_SOFTWARE: "1"
          GALLIUM_DRIVER: llvmpipe
        run: |
          nohup xvfb-run -a -s "-screen 0 1280x720x24" ./gradlew runProductionClientGameTest --console=plain \
            --stacktrace < /dev/null > "$P10/client.log" 2>&1 &
          echo $! > "$P10/client.pid"

      - name: Send the client back and forth 100 times
        timeout-minutes: 45
        run: |
          SYNAXIS_MANAGEMENT_TOKEN=$(cat "$RUNNER_TEMP/p10-secrets/management-token") \
            python3 client-fabric/gametest-env/p10.py drive \
            --management r0-c1=127.0.0.1:25585 --management r0-c2=127.0.0.1:25586 \
            --psql "psql -h 127.0.0.1 -U postgres -d postgres" --done-file "$P10/done" --out "$P10/drive.json"

      # The client's exit code is only recorded, like the regression's
      - name: Wait for the client to leave
        if: always()
        run: |
          touch "$P10/done"
          pid=$(cat "$P10/client.pid" 2>/dev/null) || exit 0
          for _ in $(seq 1 300); do
            kill -0 "$pid" 2>/dev/null || exit 0
            sleep 1
          done
          echo "the client is still running 300 s after $P10/done appeared"
          pkill -TERM -P "$pid" || true

      - name: Stop the shards
        if: always()
        run: |
          for shard in r0-c1 r0-c2; do
            pid=$(cat "$P10/work-$shard/shard.pid" 2>/dev/null) && kill -TERM "$pid" 2>/dev/null || true
          done
          for shard in r0-c1 r0-c2; do
            pid=$(cat "$P10/work-$shard/shard.pid" 2>/dev/null) || continue
            for _ in $(seq 1 60); do
              kill -0 "$pid" 2>/dev/null || break
              sleep 1
            done
            tail -n 3 "$P10/work-$shard/shard.log"
          done

      - name: Judge P10 by the driver's record, the ledgers and the client's report
        if: success() || failure()
        run: |
          python3 client-fabric/gametest-env/p10.py judge --drive "$P10/drive.json" \
            --ledger r0-c1="$P10/work-r0-c1/logs" --ledger r0-c2="$P10/work-r0-c2/logs" \
            --client-report client-fabric/build/run/productionClientGameTest/synaxis-gametest/p10.txt

      - name: Upload the record, the logs and the ledgers
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: client-gametest-p10
          path: |
            p10/drive.json
            p10/client.log
            p10/maps/p10/shards.json
            p10/work-*/shard.log
            p10/work-*/logs/events-*
            client-fabric/build/run/productionClientGameTest/synaxis-gametest/
            client-fabric/build/run/productionClientGameTest/logs/
            sessionserver.log
          retention-days: 14
