# Every test builds its own ServerProcess (REQ-013), so test classes no longer share server
# state and can run in parallel.
#
# Concurrency is per class: many @EnvTest methods block (socket accept, joining the login
# handshake future), and running them concurrently starves the JUnit ForkJoinPool.
junit.jupiter.execution.parallel.enabled=true
junit.jupiter.execution.parallel.mode.default=same_thread
junit.jupiter.execution.parallel.mode.classes.default=concurrent
